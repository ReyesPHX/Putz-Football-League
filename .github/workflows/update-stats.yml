name: Update NFL player stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run update script
        run: node scripts/update-stats.js

      - name: Commit updated stats
        run: |
          git config user.name "nfl-stats-bot"
          git config user.email "nfl-stats-bot@users.noreply.github.com"
          git add data/latest-stats.json
          git diff --staged --quiet || git commit -m "Update NFL player stats"
          git push
